name: RoofSun checks
on:
  push:
    branches: [main]
    paths: ['roofsun/**', '.github/workflows/roofsun-checks.yml']
  workflow_dispatch:
jobs:
  model-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roofsun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: roofsun/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: roofsun/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/validate.py
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m uvicorn backend.app:app --port 8000 > /tmp/roofsun-api.log 2>&1 &
          npm run dev > /tmp/roofsun-vite.log 2>&1 &
          npm run test:browser
