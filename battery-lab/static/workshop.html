<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battery Workshop</title><link rel="stylesheet" href="/static/workshop.css"></head>
<body><div class="workshop">
<header class="lab-header"><div><div class="eyebrow">BATTERY WORKSHOP / 01</div><h1 data-i="title">你的桌面，电池的实验场。</h1><p data-i="subtitle"></p></div><span class="prototype" data-i="prototype"></span></header>
<div class="workbench"><section class="viewport" id="viewport"><div id="scene"></div><div id="webglError" hidden></div>
<div class="view-top"><div class="camera-tag"><i></i><span id="viewName"></span></div><div class="view-buttons"><button id="normal" class="active" data-i="normal"></button><button id="thermal" data-i="thermal"></button><button id="rotate" data-i="rotate"></button></div></div>
<div class="device-name"><span>DEVICE 01</span><strong data-i="phone"></strong><small data-i="generic"></small></div>
<div class="scene-readout"><div><span data-i="soc"></span><strong id="soc">35.0%</strong></div><div><span data-i="surface"></span><strong id="surface">22.0°C</strong></div><div><span data-i="battery"></span><strong id="battery">22.0°C</strong></div></div>
<div id="heatLegend" class="heat-legend" hidden><span data-i="scale"></span><div></div><p><span>−10°C</span><span>25°C</span><span>60°C</span></p><small data-i="heatNote"></small></div>
<div class="scene-bottom"><span id="connectionStatus"></span><p data-i="dragHelp"></p><button id="connect" data-i="connect"></button></div>
<div class="scene-corner"><span id="sceneClock">22:00</span><small id="weatherBadge"></small></div>
</section>
<aside class="console"><div class="console-heading"><span>CONTROL DESK</span><h2 data-i="controls"></h2></div>
<label><span data-i="activity"></span><select id="activity"><option value="standby" data-i="standby"></option><option value="video" data-i="video"></option><option value="navigation" data-i="navigation"></option><option value="game" data-i="game"></option></select></label>
<label><span data-i="target"></span><div class="paired"><input id="target" type="range" min="5" max="100" value="80"><input id="targetNumber" type="number" min="5" max="100" value="80"></div></label>
<label><span data-i="power"></span><select id="power"><option value="5">5 W</option><option value="12" selected>12 W</option><option value="20">20 W</option></select></label>
<div class="schedule"><label class="toggle"><input id="scheduled" type="checkbox"><span data-i="scheduled"></span></label><div class="twocol"><label><span data-i="chargeAt"></span><input id="chargeHour" type="time" value="23:00"></label><label><span data-i="window"></span><input id="duration" type="number" min=".25" max="24" step=".25" value="4"></label></div></div>
<h3 data-i="environment"></h3><div class="twocol"><label><span data-i="season"></span><select id="season"><option value="mild" data-i="mild"></option><option value="winter" data-i="winter"></option></select></label><label><span data-i="place"></span><select id="place"><option value="indoors" data-i="indoors"></option><option value="outdoors" data-i="outdoors"></option></select></label></div>
<label><span data-i="outside"></span><div class="paired"><input id="outside" type="range" min="-15" max="40" value="18"><input id="outsideNumber" type="number" min="-15" max="40" value="18"></div></label>
<label><span data-i="room"></span><div class="paired"><input id="room" type="range" min="0" max="35" value="22"><input id="roomNumber" type="number" min="0" max="35" value="22"></div></label>
<label><span data-i="humidity"></span><div class="paired"><input id="humidity" type="range" min="0" max="100" value="50"><input id="humidityNumber" type="number" min="0" max="100" value="50"></div></label>
<div class="twocol"><label><span data-i="startTime"></span><input id="startTime" type="time" value="22:00"></label><label><span data-i="background"></span><select id="background"><option value="room" data-i="roomView"></option><option value="black" data-i="black"></option></select></label></div>
<p class="hint" data-i="environmentNote"></p></aside></div>
<section class="timeline"><div class="play-actions"><button id="play" class="primary" data-i="play"></button><button id="step" data-i="step"></button><button id="reset" data-i="reset"></button></div><div class="time-progress"><div><span data-i="elapsed"></span><strong id="elapsed">00:00</strong><span>24 h</span></div><input id="seek" type="range" min="0" max="1440" step="1" value="0" aria-label="24 hour timeline"></div><label class="speed"><span data-i="speed"></span><select id="speed"><option value="1">1×</option><option value="10">10×</option><option value="60">60×</option><option value="600" selected>600×</option><option value="3600">3600×</option></select></label></section>
<section class="debrief"><div><span class="eyebrow" data-i="observation"></span><h2 id="observationTitle"></h2><p id="observation"></p><div class="stats"><span id="energyStat"></span><span id="peakStat"></span></div></div><div class="mini-chart"><canvas id="trace" width="650" height="185"></canvas><div><span data-i="traceLegend"></span><button id="lifeProfile">参考寿命实验 / Life experiment</button><button id="download" data-i="download"></button></div></div></section>
<details class="model-details"><summary data-i="modelTitle"></summary><p data-i="modelNote"></p><code>E′ = E + (ηPcharge − Pload − I²R)Δt<br>Cbat dTbat/dt = I²R − G(Tbat − Tshell)<br>Cshell dTshell/dt = Pload + Qcharge + G(Tbat − Tshell) − H(Tshell − Tair)</code><p data-i="params"></p><p data-i="humidityNote"></p><p data-i="limits"></p><p id="coldReading"></p><a id="referenceLink" target="_blank" rel="noopener" href="https://www.molicel.com/wp-content/uploads/INR18650P28A_1.3_Product-Data-Sheet-of-INR-18650-P28A-80093.pdf"></a></details>
</div><script type="module" src="/static/workshop.js"></script></body></html>
